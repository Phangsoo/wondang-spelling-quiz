:root{--ink:#202635;--sub:#697385;--line:#e1e6ed;--bg:#f3f5f9;--blue:#2c4d86;--good:#e9f8ef;--bad:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}.wrap{max-width:790px;margin:auto;padding:22px 14px 70px}.card{background:white;border:1px solid var(--line);border-radius:21px;padding:26px;box-shadow:0 10px 35px #15263c0a}h1{font-size:clamp(23px,5vw,30px);margin:0 0 12px}h2{font-size:19px;line-height:1.75;white-space:pre-wrap;margin:15px 0}.muted{color:var(--sub);line-height:1.65}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:12px;border-radius:99px;background:#edf1f7;padding:6px 11px}.progress{height:8px;background:#e9edf3;border-radius:99px;margin:16px 0 24px;overflow:hidden}.progress>div{height:100%;background:var(--blue);transition:width .2s}.hidden{display:none!important}button,select,input{font:inherit}button{border:1px solid #dce3ed;border-radius:12px;padding:12px 16px;background:#fff;cursor:pointer;touch-action:manipulation}button.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}button.full{display:block;width:100%;text-align:left;margin:8px 0;line-height:1.5}button.selected{background:#e8eefb;border-color:#365c9c;box-shadow:0 0 0 1px #365c9c}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.actions button{flex:1;min-width:140px}.feedback{padding:15px;margin-top:17px;border-radius:12px;white-space:pre-wrap;line-height:1.7}.good{background:var(--good)}.bad{background:var(--bad)}input[type=text]{width:100%;border:1px solid #cdd6e3;border-radius:12px;padding:14px;font-size:18px}.lineitem{padding:12px 0;border-bottom:1px solid #edf0f4;line-height:1.7;white-space:pre-wrap}.lineitem:last-child{border:0}.lineitem select,.rule select{max-width:100%;padding:7px;border-radius:9px;border:1px solid #bbc9da;background:#fff;font-size:16px}.rule{padding:10px 0;line-hei ndex)));let pair=document.createElement('span');pair.className='inlinePair';pair.dataset.answer='';pair.classList.add('inlineChoice');pair.setAttribute('aria-label',`${pos+1}번 선택`);mix(x.choices[pos]).forEach(v=>{let b=document.createElement('button');b.type='button';b.className='pairButton';b.textContent=v;b.onclick=()=>{if(locked)return;pair.dataset.answer=v;pair.querySelectorAll('button').forEach(t=>t.classList.toggle('selected',t===b))};pair.appendChild(b)});div.appendChild(pair);last=m.index+m[0].length;pos++}div.appendChild(document.createTextNode(line.slice(last)));area.appendChild(div)})}else if(x.type==='classify')renderClass(x);if(history[idx]){locked=true;let h=history[idx],fb=$('fb');fb.className='feedback '+(h.correct?'good':'bad');fb.textContent=(h.correct?'정답입니다!':'오답입니다.')+'\n\n내 답:\n'+h.user+(h.correct?'':'\n\n정답:\n'+h.correctText)+(x.explanation?'\n\n해설: '+x.explanation:'');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===qs.length-1?'결과 보기':'다음 문제'}}

    }else if(x.sourceRow===24){
      // 규정의 핵심 어휘만 색으로 구분한다. 1~3: 순우리말, 4~6: 순우리말과 한자어
      const highlights = j<3?['순우리말']:j<6?['순우리말과 한자어']:j===6?['예외']:['않는'];
      if(j<6){
        if(j%3===0)highlights.push('된소리');
        else if(j%3===1)highlights.push('ㄴ');
        else highlights.push('ㄴㄴ');
      }
      // 'ㄴ, ㅁ'은 발음 환경이므로 강조하지 않고, '앞에서' 뒤의 덧나는 소리만 강조한다.
      const ranges=[];
      for(const term of highlights){
        let at=term==='ㄴ' ? label.lastIndexOf('‘ㄴ’ 소리가')+1 : label.indexOf(term);
        if(term==='ㄴ' && !label.includes('‘ㄴ’ 소리가'))at=-1;
        if(at>=0)ranges.push({start:at,end:at+term.length});
      }
      ranges.sort((a,b)=>a.start-b.start);
      let cursor=0;
      for(const r of ranges){
        if(r.start<cursor)continue;
        heading.appendChild(document.createTextNode(label.slice(cursor,r.start)));
        const em=document.createElement('span');em.className='ruleHighlight';
        em.textContent=label.slice(r.start,r.end);heading.appendChild(em);
        cursor=r.end;
      }
      heading.appendChild(document.createTextNode(label.slice(cursor)));
    }else heading.textContent=label;
    zone.appendChild(heading);
    const target=document.createElement('div');target.className='zoneWords slotGrid';
    const count=x.groupAnswers[j].length;
    for(let k=0;k<count;k++){
      const slot=document.createElement('div');slot.className='wordSlot';slot.dataset.group=j;slot.dataset.slot=k;
      slot.setAttribute('aria-label',`${label} ${k+1}번 빈칸`);
      slot.onclick=e=>{if(e.target.closest('.chip'))return;e.stopPropagation();if(activeChip!==null)moveChip(activeChip,j,x,k)};
      target.appendChild(slot);
    }
    zone.appendChild(target);
    zone.ondragover=e=>{e.preventDefault();zone.classList.add('over')};
    zone.ondragleave=()=>zone.classList.remove('over');
    zone.ondrop=e=>{e.preventDefault();zone.classList.remove('over');const slot=e.target.closest('.wordSlot');moveChip(e.dataTransfer.getData('text/plain'),j,x,slot?Number(slot.dataset.slot):undefined)};
    zone.onclick=e=>{if(e.target.closest('.chip, .ruleOption, .wordSlot'))return;if(activeChip!==null)moveChip(activeChip,j,x)};
    zones.appendChild(zone);
  });
  bank.ondragover=e=>e.preventDefault();
  bank.ondrop=e=>{e.preventDefault();moveChip(e.dataTransfer.getData('text/plain'),null,x)};
  mix(x.words.map((w,j)=>({word:w,id:String(j)}))).forEach(o=>{
    placement[o.id]=null;
    const chip=document.createElement('button');chip.type='button';chip.className='chip';chip.draggable=true;
    chip.dataset.id=o.id;chip.dataset.word=o.word;chip.textContent=o.word;
    chip.ondragstart=e=>{activeChip=o.id;e.dataTransfer.setData('text/plain',o.id)};
    chip.onclick=e=>{e.stopPropagation();if(locked)return;if(placement[o.id]!==null){moveChip(o.id,null,x);return}activeChip=activeChip===o.id?null:o.id;refreshChips()};
    bank.appendChild(chip);
  });
}
function refreshChips(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.id===activeChip))}
function moveChip(id,group,x,slotIndex){
  if(locked||!(id in placement))return;
  const chip=[...document.querySelectorAll('.chip')].find(c=>c.dataset.id===id);
  if(!chip)return;
  let destination=$('bank');
  if(group!==null){
    const zone=document.querySelectorAll('.zoneWords')[group];
    const slots=[...zone.querySelectorAll('.wordSlot')];
    let slot=Number.isInteger(slotIndex)?slots[slotIndex]:slots.find(el=>!el.querySelector('.chip')||el.contains(chip));
    if(!slot){alert('이 규정의 빈칸이 모두 찼습니다. 낱말을 다시 눌러 비운 후 배치해 주세요.');return}
    const occupant=slot.querySelector('.chip');
    if(occupant&&occupant!==chip){placement[occupant.dataset.id]=null;occupant.textContent=occupant.dataset.word;$('bank').appendChild(occupant)}
    destination=slot;
  }
  placement[id]=group;
  chip.textContent=group!==null&&x.transform?transformWord(chip.dataset.word,x,group):chip.dataset.word;
  destination.appendChild(chip);
  activeChip=null;refreshChips();
}
function transformWord(word,x,group){
  // 사이시옷 분류: 정답 여부가 아니라 사용자가 넣은 칸의 규칙으로 표기를 바꾼다.
  if(x.sourceRow===24 && word.includes('+')){
    const [front,...rest]=word.split('+');
    const back=rest.join('+');
    if(group===7)return front+back; // 사이시옷을 받쳐 적지 않는 칸
    const last=front.charCodeAt(front.length-1);
    // 모음으로 끝나는 현대 한글 음절에 받침 ㅅ(종성 인덱스 19)을 붙인다.
    if(last>=0xAC00 && last<=0xD7A3 && (last-0xAC00)%28===0){
      return front.slice(0,-1)+String.fromCharCode(last+19)+back;
    }
    return front+'ㅅ'+back;
  }
  let index=x.words.indexOf(word);
  return x.wordTargets[index]===group?x.wordOutputs[index]:word.replaceAll('+','');
}
function normalized(s){return String(s||'').normalize('NFC').replace(/\s+/g,'').trim()};function correctText(x){if(x.type==='ox')return x.answer;if(x.type==='short')return x.answers.length===1&&x.answers[0].includes(',')?x.answers[0].split(',').map((v,j)=>`${j+1}. ${v.trim()}`).join('\n'):x.answers.join(' / ');if(x.type==='single'||x.type==='multi')return x.answers.join(', ');if(x.type==='inline')return x.answers.map((a,j)=>`${j+1}. ${a}`).join('\n');if(x.type==='classify')return x.groupAnswers.map((a,j)=>`${x.groups[j]}: ${a.join(', ')}`).join('\n')+(x.ruleAnswers?'\n'+x.ruleAnswers.map((a,j)=>a?`${j+1}. ${a}`:'').filter(Boolean).join(' / '):'');return ''}
function check(){if(locked)return;let x=qs[idx],user='',ok=false;if(x.type==='ox'||x.type==='single'||x.type==='multi'){let selected=[...$('area').querySelectorAll('button.selected')].map(b=>b.textContent);if(!selected.length){alert('답을 선택해 주세요.');return}user=selected.join(', ');let key=x.type==='ox'?[x.answer]:x.answers;ok=selected.length===key.length&&selected.every(v=>key.includes(v))}else if(x.type==='short'){let fields=[...$('area').querySelectorAll('.short-part')];if(fields.length){let vals=fields.map(el=>el.value.trim());if(vals.some(v=>!v)){alert('세 빈칸에 모두 답을 입력해 주세요.');return}user=vals.map((v,j)=>`${j+1}. ${v}`).join('\n');let expected=x.answers[0].split(',').map(v=>v.trim());ok=vals.length===expected.length&&vals.every((v,j)=>normalized(v)===normalized(expected[j]))}else{user=$('shortAnswer').value.trim();if(!user){alert('답을 입력해 주세요.');return}ok=x.answers.some(a=>normalized(a)===normalized(user))}}else if(x.type==='inline'){let vals=[...document.querySelectorAll('.inlineChoice')].map(s=>s.dataset.answer);if(vals.some(v=>!v)){alert('모든 항목을 선택해 주세요.');return}user=vals.map((v,j)=>`${j+1}. ${v}`).join('\n');ok=vals.every((v,j)=>normalized(v)===normalized(x.answers[j]))}else if(x.type==='classify'){if(Object.values(placement).some(v=>v===null)){alert('모든 단어를 분류해 주세요.');return}if(x.ruleAnswers&&x.ruleAnswers.some((v,j)=>v&&!ruleVals[j])){alert('밝혀 적는다 / 밝혀 적지 않는다 항목도 선택해 주세요.');return}let chipMap=Object.fromEntries([...document.querySelectorAll('.chip')].map(c=>[c.dataset.id,c.dataset.word]));user=x.groups.map((g,j)=>`${g}: ${Object.keys(placement).filter(id=>placement[id]===j).map(id=>chipMap[id]).join(', ')}`).join('\n');let actual=x.groups.map((_,j)=>Object.keys(placement).filter(id=>placement[id]===j).map(id=>chipMap[id]).sort());let expected=x.groupAnswers.map(a=>[...a].sort());if(x.transform){ok=Object.keys(placement).every(id=>placement[id]===x.wordTargets[x.words.indexOf(chipMap[id])])}else ok=actual.every((a,j)=>JSON.stringify(a)===JSON.stringify(expected[j]));if(x.ruleAnswers)ok=ok&&x.ruleAnswers.every((v,j)=>!v||ruleVals[j]===v);if(x.ruleAnswers)user+='\n'+x.ruleAnswers.map((v,j)=>v?`${j+1}. ${ruleVals[j]||'미선택'}`:'').filter(Boolean).join(' / ')}locked=true;history[idx]={question:x,user,correct:ok,correctText:correctText(x)};let fb=$('fb');fb.className='feedback '+(ok?'good':'bad');fb.textContent=(ok?'정답입니다!':'오답입니다.')+(ok?'':'\n\n정답:\n'+correctText(x))+(x.explanation?'\n\n해설: '+x.explanation:'');$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=idx===qs.length-1?'결과 보기':'다음 문제';fb.scrollIntoView({behavior:'smooth',block:'nearest'})}
function previous(){if(idx>0){idx--;render();window.scrollTo(0,0)}}function next(){if(idx<qs.length-1){idx++;render();window.scrollTo(0,0)}else result()}function result(){show('result');let n=history.filter(h=>h.correct).length;$('score').textContent=`${n} / ${history.length}`;$('summary').textContent=`정답률 ${Math.round(n/history.length*100)}% · 오답 ${history.length-n}개`}
function wrongView(){show('wrong');let arr=history.filter(h=>!h.correct);$('wrongList').innerHTML=arr.length?arr.map((h,j)=>`<div class="review"><b>${j+1}. ${esc(h.question.question)}</b><p>내 답: ${esc(h.user)}</p><p><b>정답: ${esc(h.correctText)}</b></p>${h.question.explanation?`<p class="muted">${esc(h.question.explanation)}</p>`:''}</div>`).join(''):'<p>틀린 문제가 없습니다. 축하합니다!</p>'}function retryWrong(){let arr=history.filter(h=>!h.correct).map(h=>h.question);if(!arr.length){alert('틀린 문제가 없습니다.');return}start(mix(arr))}function home(){show('start')}
</script></body></html>
